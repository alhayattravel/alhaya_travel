<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شركة الحياة للسياحة والسفريات | Al-Haya Travel</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#070D1E',
                            card: '#121A2D',
                            accent: '#00B4D8',
                            gold: '#D4AF37'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Arabic Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #070D1E; color: #F1F5F9; }
        .active-tab { background-color: #00B4D8 !important; color: #FFFFFF !important; }

        /* تعديل ألوان النصوص داخل محرك البحث لتكون واضحة 100% */
        #tpwl-search input, 
        #tpwl-search span, 
        #tpwl-search button, 
        #tpwl-search div,
        .tpwl-widget input,
        .tpwl-widget span {
            color: #0F172A !important; /* لون داكن جداً واضح */
            font-weight: 700 !important;
        }

        /* إصلاح نصوص الخانات والأماكن المحددة */
        #tpwl-search ::placeholder {
            color: #64748B !important;
            opacity: 1 !important;
        }
    </style>

    <!-- Travelpayouts White Label Script -->
    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1">
      (function () {
            var script = document.createElement("script");
            script.async = 1;
            script.type = "module";
            script.src = "https://tpwgts.com/wl_web/main.js?wl_id=20408";
            document.head.appendChild(script);
          })();
    </script>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="bg-[#0D1527] border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            
            <!-- Company Logo & Title -->
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20 shrink-0">
                    <i class="fa-solid fa-plane-departure"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-amber-400 leading-tight">شركة الحياة</h1>
                    <p class="text-[10px] text-slate-400 font-medium">للسياحة والسفريات</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2">
                <button onclick="toggleLanguage()" id="langBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg border border-slate-700 transition">
                    <span id="langText">English</span>
                </button>

                <a href="https://wa.me/message/IIVGBQM3AL7SF1" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-headset"></i>
                    <span data-ar="خدمة العملاء" data-en="Support">خدمة العملاء</span>
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow">

        <!-- Top Category Navigation -->
        <div class="grid grid-cols-4 gap-2.5 mb-6">
            <button onclick="switchCategory('flights')" id="cat-flights" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-[#121A2D] border border-slate-800 active-tab transition">
                <i class="fa-solid fa-plane text-lg"></i>
                <span class="text-xs font-bold" data-ar="رحلات" data-en="Flights">رحلات</span>
            </button>

            <button onclick="switchCategory('hotels')" id="cat-hotels" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-[#121A2D] border border-slate-800 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-hotel text-lg"></i>
                <span class="text-xs font-bold" data-ar="إقامة" data-en="Hotels">إقامة</span>
            </button>

            <button onclick="switchCategory('cars')" id="cat-cars" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-[#121A2D] border border-slate-800 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-car text-lg"></i>
                <span class="text-xs font-bold" data-ar="سيارات" data-en="Cars">سيارات</span>
            </button>

            <button onclick="switchCategory('services')" id="cat-services" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-[#121A2D] border border-slate-800 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-passport text-lg"></i>
                <span class="text-xs font-bold" data-ar="تأشيرات" data-en="Visas">تأشيرات</span>
            </button>
        </div>

        <!-- White Label Search & Ticket Results Area -->
        <div class="bg-[#121A2D] rounded-3xl p-4 md:p-6 border border-slate-800 shadow-2xl mb-8 min-h-[400px]">
            <!-- White Label Search Bar Container -->
            <div id="tpwl-search" class="mb-4"></div>
            
            <!-- White Label Ticket Results Container -->
            <div id="tpwl-tickets"></div>
        </div>

        <!-- Social Media Links Section -->
        <section class="bg-[#121A2D]/60 border border-slate-800 rounded-2xl p-4 text-center">
            <p class="text-xs font-semibold text-slate-300 mb-3" data-ar="تواصل معنا عبر منصاتنا الرسمية" data-en="Connect with us on social media">تواصل معنا عبر منصاتنا الرسمية</p>
            <div class="flex flex-wrap justify-center gap-2.5">
                <a href="https://wa.me/message/IIVGBQM3AL7SF1" target="_blank" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://www.instagram.com/alhaya_ttravel" target="_blank" class="bg-pink-500/10 text-pink-400 border border-pink-500/20 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-brands fa-instagram"></i> Instagram
                </a>
                <a href="https://www.facebook.com/share/1RgnZW5DFa/" target="_blank" class="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-brands fa-facebook"></i> Facebook
                </a>
                <a href="https://www.tiktok.com/@alhaya_ttravel" target="_blank" class="bg-slate-700/30 text-slate-300 border border-slate-700/50 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-brands fa-tiktok"></i> TikTok
                </a>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-[#0D1527] border-t border-slate-800 py-3 text-center text-[11px] text-slate-500">
        © 2026 شركة الحياة للسياحة والسفريات. جميع الحقوق محفوظة.
    </footer>

    <!-- Toggle Language & Navigation Script -->
    <script>
        let currentLang = 'ar';
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
            document.getElementById('langText').innerText = currentLang === 'en' ? 'العربية' : 'English';
            
            document.querySelectorAll('[data-ar]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
        }

        function switchCategory(cat) {
            document.querySelectorAll('#cat-flights, #cat-hotels, #cat-cars, #cat-services').forEach(b => {
                b.classList.remove('active-tab');
                b.classList.add('text-slate-400');
            });
            const active = document.getElementById(`cat-${cat}`);
            active.classList.add('active-tab');
            active.classList.remove('text-slate-400');
        }
    </script>
</body>
</html>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        let currentLang = 'ar';

        // Function to toggle between Arabic and English seamlessly
        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            
            // Set Document Direction & Language Attribute
            document.documentElement.dir = currentLang === 'en' ? 'ltr' : 'rtl';
            document.documentElement.lang = currentLang;
            
            // Update Language Switcher Button Text
            document.getElementById('langText').innerText = currentLang === 'en' ? 'العربية' : 'English';
            
            // Translate all elements with data attributes
            document.querySelectorAll('[data-ar]').forEach(el => {
                el.innerText = el.getAttribute(`data-${currentLang}`);
            });
        }

        // Function for category button tab switching
        function switchCategory(category) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                btn.classList.add('text-slate-400');
            });
            
            const activeBtn = document.getElementById(`cat-${category}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-slate-400');
            }
        }
    </script>

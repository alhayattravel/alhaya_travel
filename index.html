<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقارن أسعار التذاكر الاحترافي</title>
    <!-- Tailwind CSS للتصميم السريع والمجاوب -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold"><i class="fa-solid => fa-plane-departure ml-2"></i> محرك مقارنة رحلات الطيران</h1>
            <p class="text-blue-100 mt-1">إيجاد أفضل الأسعار من مختلف شركات الطيران في ثوانٍ</p>
        </div>
    </header>

    <!-- Search Form Section -->
    <main class="container mx-auto px-4 my-8 max-w-5xl">
        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
            <form id="searchForm" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">من (المغادرة)</label>
                    <input type="text" id="origin" placeholder="رمز المطار (مثال: DXB)" required class="w-full border rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">إلى (الوجهة)</label>
                    <input type="text" id="destination" placeholder="رمز المطار (مثال: CAI)" required class="w-full border rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">تاريخ السفر</label>
                    <input type="date" id="departureDate" required class="w-full border rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex items-end">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2.5 rounded-md transition duration-200">
                        <i class="fa-solid fa-magnifying-glass ml-1"></i> ابحث عن الرحلات
                    </button>
                </div>
            </form>
        </div>

        <!-- Results Section -->
        <div id="resultsContainer" class="mt-8 space-y-4">
            <!-- ستظهر نتائج البحث هنا عبر JavaScript -->
        </div>
    </main>

    <!-- JavaScript Client Code -->
    <script>
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const departureDate = document.getElementById('departureDate').value;
            const resultsContainer = document.getElementById('resultsContainer');

            // إظهار مؤشر التحميل
            resultsContainer.innerHTML = `
                <div class="text-center py-10">
                    <p class="text-gray-500 text-lg"><i class="fa-solid fa-spinner fa-spin text-blue-600 ml-2"></i> جاري جلب ومقارنة الأسعار...</p>
                </div>
            `;

            try {
                const response = await fetch(`http://localhost:5000/api/flights/search?origin=${origin}&destination=${destination}&departureDate=${departureDate}`);
                const result = await response.json();

                if (!result.success || result.data.length === 0) {
                    resultsContainer.innerHTML = `<div class="text-center p-6 bg-white rounded shadow">لا توجد رحلات متاحة لهذا المسار.</div>`;
                    return;
                }

                // بناء واجهة عرض التذاكر
                resultsContainer.innerHTML = result.data.map((flight, index) => `
                    <div class="bg-white p-5 rounded-lg shadow-sm border hover:shadow-md transition flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-4 w-full md:w-1/3">
                            <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center font-bold text-blue-600">
                                <i class="fa-solid fa-plane"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">${flight.airline}</h3>
                                <p class="text-xs text-gray-500">رقم الرحلة: ${flight.flightNumber}</p>
                            </div>
                        </div>

                        <div class="flex items-center justify-between w-full md:w-1/3 text-center">
                            <div>
                                <p class="text-xl font-bold">${flight.departure}</p>
                                <p class="text-xs text-gray-500">${origin.toUpperCase()}</p>
                            </div>
                            <div class="text-xs text-gray-400">
                                <p>${flight.duration}</p>
                                <div class="w-16 h-0.5 bg-gray-300 my-1 mx-auto"></div>
                                <p class="text-green-600">مباشر</p>
                            </div>
                            <div>
                                <p class="text-xl font-bold">${flight.arrival}</p>
                                <p class="text-xs text-gray-500">${destination.toUpperCase()}</p>
                            </div>
                        </div>

                        <div class="flex flex-col items-end w-full md:w-1/4 border-t md:border-t-0 pt-3 md:pt-0 border-gray-100">
                            ${index === 0 ? '<span class="bg-green-100 text-green-800 text-xs px-2 py-0.5 rounded font-semibold mb-1">أرخص سعر</span>' : ''}
                            <span class="text-2xl font-black text-blue-600">${flight.price} ${flight.currency}</span>
                            <button class="mt-2 w-full md:w-auto bg-green-600 hover:bg-green-700 text-white text-sm font-bold py-2 px-6 rounded transition">
                                احجز الآن
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = `<div class="text-center p-6 bg-red-50 text-red-600 rounded">تعذر الاتصال بالخادم. يرجى التأكد من تشغيل Node.js.</div>`;
            }
        });
    </script>
</body>
</html>

backend:
  name: github
  repo: alhaya_travel/alhaya_travel
  branch: main
  base_url: https://decap-cms-oauth.netlify.app

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "صفحات الموقع"
    files:
      - file: "index.html"
        label: "الصفحة الرئيسية"
        name: "home"
        fields:
          - { label: "عنوان الموقع الرئيسي", name: "title", widget: "string" }
